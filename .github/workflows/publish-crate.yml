name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml to publish
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish arch-kit ${{ inputs.version }}
    runs-on: ubuntu-24.04
    environment: crates-io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          rustflags: ""

      - name: Verify release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          crate_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "arch-kit") | .version'
          )"
          workflow_version="$(
            sed -n 's/^  ARCH_KIT_VERSION: //p' \
              .github/workflows/deploy-program.yml
          )"

          test -n "${crate_version}"
          test "${REQUESTED_VERSION}" = "${crate_version}" || {
            echo "Requested ${REQUESTED_VERSION}, but Cargo.toml contains ${crate_version}" >&2
            exit 1
          }
          test "${workflow_version}" = "${crate_version}" || {
            echo "deploy-program.yml installs ${workflow_version}, expected ${crate_version}" >&2
            exit 1
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify package
        run: |
          set -euo pipefail
          cargo package --locked
          cargo publish --dry-run --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

[package]
name = "arch-kit"
version = "0.1.0"
edition = "2024"

[dependencies]
apl-associated-token-account = { version = "=0.8.2", features = ["no-entrypoint"] }
apl-token = { version = "=0.8.2", features = ["no-entrypoint"] }
arch_sdk = "=0.8.2"
bitcoin = "=0.32.7"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.1"
hex = "0.4"
include_dir = "0.7"
minijinja = "2"
rand = "0.8"
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"
